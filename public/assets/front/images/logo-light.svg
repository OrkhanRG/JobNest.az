<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="JobNest logo">
  <title>JobNest wordmark</title>
  <desc>Two-tone wordmark with "Job" and "Nest" joined; colors customized for theme usage.</desc>
  <style>
    .word {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      font-weight: 800;
      font-size: 250px;
      letter-spacing: 0;
      dominant-baseline: middle;
    }
  </style>
  <text x="50" y="150" class="word" fill="#FFFFFF">Job</text>
  <text x="500" y="150" class="word" fill="#1967D2">Nest</text>
</svg>
